name: GSL standalone QR comparison
on:
  push:
    branches: [codex/gsl-qr-reproducer]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install published x64 GSL and netlib
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/mamba-org/micromamba-releases/releases/download/1.5.10-0/micromamba-win-64' -OutFile C:\micromamba.exe
          & C:\micromamba.exe create -y -r C:\mamba -p C:\consumer --platform win-64 --override-channels --strict-channel-priority -c conda-forge gsl=2.8 'libblas=3.9.0=16*_netlib' 'libcblas=3.9.0=16*_netlib'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content C:\consumer\conda-meta\gsl-*.json
      - name: Compile and run exact captured system
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VS_PATH=%%i"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          set "PATH=C:\consumer\Library\bin;%PATH%"
          cl /nologo /std:c11 /MD /O2 /DGSL_DLL /DWIN32 /IC:\consumer\Library\include .github\qr-reproducer\reproduce.c /link /LIBPATH:C:\consumer\Library\lib gsl.lib cblas.lib /OUT:reproduce.exe
          if errorlevel 1 exit /b 1
          dumpbin /headers reproduce.exe | findstr /I /C:"8664 machine (x64)"
          if errorlevel 1 exit /b 1
          reproduce.exe
          exit /b %ERRORLEVEL%
